<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>og-image source</title>
<!-- Source for og-image.png. Render at 1200x630 with Playwright:
     page.setViewportSize({width:1200,height:630}); page.goto('og-image.html'); page.screenshot({path:'og-image.png'}) -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0B2821;color:#FBFDFC;font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{display:grid;grid-template-columns:minmax(0,1fr) 389px;gap:64px;padding:72px;height:100%}
.text{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mark{font-weight:700;font-size:30px;letter-spacing:-0.02em}
.mark span{color:#9FB5AC;font-weight:400}
h1{font-weight:700;font-size:62px;line-height:0.99;letter-spacing:-0.04em;margin:0;max-width:15ch}
.rule{width:64px;height:3px;background:#2563EB;margin-top:30px}
.frame{border:1px solid #1E453B;background:#071C17;padding:10px;height:486px}
.frame img{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="card">
  <div class="text">
    <div class="mark">Kyle Myers <span>/ Miamisburg, Ohio</span></div>
    <div>
      <h1>I run $8.9M a year in ad spend. I also write the software that runs it.</h1>
      <div class="rule"></div>
    </div>
  </div>
  <div class="frame"><img src="kyle.jpg" alt=""></div>
</div>
</body>
</html>
