<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyle Myers</title>
<meta name="description" content="Performance marketing strategist who builds the software behind the work. Ecommerce paid media, product feeds, attribution, and the tools that run them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFAF8;
  --ink:#1A1C1B;
  --pine:#0C2B24;
  --pine-deep:#071C17;
  --moss:#5B6A63;
  --signal:#2563EB;
  --signal-quiet:#E8EEFC;
  --rule:#DFDBD3;
  --rule-dark:#1E453B;

  --display:'Archivo',system-ui,sans-serif;
  --body:'Source Serif 4',Georgia,serif;

  --measure:66ch;
  --gut:clamp(20px,5vw,72px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E100F; --ink:#EDEBE6; --moss:#96A099;
    --rule:#262A28; --rule-dark:#26473E;
    --signal:#7BA1FF; --signal-quiet:#131C2E;
    --pine:#0A241E; --pine-deep:#061713;
  }
}
:root[data-theme="dark"]{
  --paper:#0E100F; --ink:#EDEBE6; --moss:#96A099;
  --rule:#262A28; --rule-dark:#26473E;
  --signal:#7BA1FF; --signal-quiet:#131C2E;
  --pine:#0A241E; --pine-deep:#061713;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased; font-optical-sizing:auto;
}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px; border-radius:2px}

.shell{max-width:1140px;margin:0 auto;padding:0 var(--gut)}
.narrow{max-width:var(--measure)}

/* ---------- type ---------- */
h1,h2,h3,h4{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-0.025em;line-height:1.05}
h1{font-size:clamp(2.6rem,6.6vw,5rem);line-height:0.99;letter-spacing:-0.04em}
h2{font-size:clamp(1.7rem,3.4vw,2.7rem);letter-spacing:-0.03em}
h3{font-size:clamp(1.2rem,2vw,1.5rem);letter-spacing:-0.02em}
h4{font-size:1.02rem;font-weight:600;letter-spacing:-0.005em}
p{margin:0 0 1.05em}
.lede{font-size:clamp(1.12rem,1.8vw,1.32rem);line-height:1.55;color:var(--ink)}
.quiet{color:var(--moss)}
.sm{font-size:0.9rem;line-height:1.55}
em{font-style:italic}
strong{font-weight:600}
.num{font-family:var(--display);font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar .shell{display:flex;align-items:center;justify-content:space-between;height:58px}
.mark{font-family:var(--display);font-weight:700;font-size:0.98rem;letter-spacing:-0.02em;text-decoration:none}
.mark span{color:var(--moss);font-weight:400}
.barlinks{display:flex;gap:22px;font-family:var(--display);font-size:0.86rem;font-weight:500}
.barlinks a{text-decoration:none;color:var(--moss);padding:4px 0;border-bottom:1.5px solid transparent}
.barlinks a:hover{color:var(--ink);border-bottom-color:var(--signal)}
@media(max-width:620px){.barlinks a:nth-child(1){display:none}}

/* ---------- hero ---------- */
.hero{background:var(--pine);color:#F2F5F3;padding:clamp(64px,11vw,132px) 0 clamp(52px,8vw,92px)}
.hero h1{color:#FBFDFC;max-width:15ch}
.hero .rule{width:64px;height:3px;background:var(--signal);margin:30px 0 26px}
.hero p{color:#BFCFC8;max-width:54ch;font-size:clamp(1.08rem,1.7vw,1.24rem);line-height:1.58}
.hero .proof{
  margin-top:clamp(36px,5vw,58px);border-top:1px solid var(--rule-dark);
  padding-top:26px;display:grid;gap:26px;
}
@media(min-width:760px){.hero .proof{grid-template-columns:repeat(3,minmax(0,1fr));gap:34px}}
.pf .n{font-family:var(--display);font-weight:700;font-size:clamp(1.55rem,2.8vw,2rem);color:#FBFDFC;letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.pf .n b{color:var(--signal);font-weight:700}
.pf p{margin:5px 0 0;font-size:0.94rem;line-height:1.5;color:#9FB5AC}

/* ---------- sections ---------- */
section{padding:clamp(54px,8vw,96px) 0}
.sechead{display:flex;align-items:baseline;gap:18px;margin-bottom:30px;border-bottom:1px solid var(--rule);padding-bottom:14px}
.sechead h2{flex:0 0 auto}
.sechead .note{font-family:var(--display);font-size:0.82rem;font-weight:500;color:var(--moss);margin-left:auto;text-align:right}
@media(max-width:620px){.sechead{flex-wrap:wrap;gap:8px}.sechead .note{margin-left:0;text-align:left;flex-basis:100%}}

/* ---------- build index ---------- */
.builds{border-top:1px solid var(--rule)}
.build{
  display:block;text-decoration:none;color:inherit;
  border-bottom:1px solid var(--rule);padding:26px 0;
  display:grid;gap:8px;
  transition:background 180ms ease, padding 180ms ease;
}
@media(min-width:840px){
  .build{grid-template-columns:minmax(0,1fr) 300px;gap:10px 44px;align-items:start}
  .build .meta{grid-row:1/3;grid-column:2;padding-top:5px}
}
.build:hover{background:var(--signal-quiet);padding-left:14px;padding-right:14px}
.build h3{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.build h3 .kind{font-family:var(--display);font-size:0.74rem;font-weight:600;color:var(--signal);letter-spacing:0.01em;border:1px solid currentColor;border-radius:3px;padding:2px 7px;position:relative;top:-2px}
.build p{margin:0;max-width:60ch;color:var(--moss);font-size:1.01rem;line-height:1.58}
.build .meta{font-family:var(--display);font-size:0.83rem;color:var(--moss);line-height:1.7}
.build .meta div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dotted var(--rule);padding:3px 0}
.build .meta div b{font-weight:500;color:var(--ink);text-align:right}

/* ---------- results ---------- */
.results{display:grid;gap:0;border-top:1px solid var(--rule)}
.res{border-bottom:1px solid var(--rule);padding:24px 0;display:grid;gap:10px}
@media(min-width:840px){.res{grid-template-columns:220px minmax(0,1fr);gap:44px;align-items:baseline}}
.res .headline{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-0.025em;line-height:1.2}
.res .headline b{color:var(--signal)}
.res p{margin:0;color:var(--moss);max-width:62ch}
.res .who{font-size:0.86rem;color:var(--moss);font-family:var(--display);margin-top:6px}

/* ---------- about ---------- */
.about{background:var(--pine-deep);color:#E8EFEB}
.about h2{color:#FBFDFC}
.about .sechead{border-bottom-color:var(--rule-dark)}
.about .sechead .note{color:#8BA298}
.aboutgrid{display:grid;gap:34px}
@media(min-width:860px){.aboutgrid{grid-template-columns:minmax(0,1fr) 260px;gap:58px;align-items:start}}
.about p{color:#C3D2CB;max-width:62ch}
.about strong{color:#FBFDFC;font-weight:600}
.portrait{border:1px solid var(--rule-dark);background:#0A241E;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .ph{font-family:var(--display);font-size:0.8rem;color:#6F8880;line-height:1.6}
.facts{margin-top:22px;font-family:var(--display);font-size:0.86rem;color:#9FB5AC}
.facts div{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--rule-dark);padding:7px 0}
.facts div b{font-weight:500;color:#E8EFEB;text-align:right}

/* ---------- contact ---------- */
.contact{border-top:1px solid var(--rule)}
.contact .lede{max-width:48ch}
.clinks{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.clinks a{
  font-family:var(--display);font-weight:500;font-size:0.95rem;text-decoration:none;
  border:1.5px solid var(--ink);padding:11px 20px;border-radius:3px;
  transition:background 160ms ease,color 160ms ease,border-color 160ms ease;
}
.clinks a:hover{background:var(--signal);border-color:var(--signal);color:#fff}

footer{border-top:1px solid var(--rule);padding:26px 0 46px;font-size:0.84rem;color:var(--moss);font-family:var(--display)}
footer .shell{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- case study ---------- */
.cshead{background:var(--pine);color:#F2F5F3;padding:clamp(46px,7vw,86px) 0 clamp(34px,5vw,56px)}
.csback{font-family:var(--display);font-size:0.86rem;font-weight:500;color:#9FB5AC;text-decoration:none;display:inline-block;margin-bottom:26px;border-bottom:1.5px solid transparent;padding-bottom:2px}
.csback:hover{color:#FBFDFC;border-bottom-color:var(--signal)}
.cshead h1{font-size:clamp(2.1rem,5vw,3.6rem);color:#FBFDFC;max-width:18ch}
.cshead .sub{color:#BFCFC8;font-size:clamp(1.04rem,1.6vw,1.18rem);margin-top:18px;max-width:56ch;line-height:1.55}
.spec{margin-top:clamp(30px,4vw,46px);border-top:1px solid var(--rule-dark);padding-top:22px;
  display:grid;gap:16px;font-family:var(--display);font-size:0.86rem}
@media(min-width:720px){.spec{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}}
.spec div span{display:block;color:#7F9890;margin-bottom:3px;font-size:0.78rem}
.spec div b{font-weight:500;color:#E8EFEB;line-height:1.45;display:block}

.csbody{padding:clamp(48px,7vw,84px) 0 0}
.block{margin-bottom:clamp(42px,6vw,68px)}
.block > h2{margin-bottom:16px}
.block .narrow p:last-child{margin-bottom:0}

/* architecture flow: numbered because it IS a sequence */
.flow{border-top:1px solid var(--rule);margin-top:8px}
.flowstep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;border-bottom:1px solid var(--rule);padding:16px 0;align-items:start}
.flowstep .i{font-family:var(--display);font-weight:700;font-size:0.82rem;color:var(--signal);width:26px;padding-top:3px;font-variant-numeric:tabular-nums}
.flowstep h4{margin-bottom:3px}
.flowstep p{margin:0;color:var(--moss);font-size:0.98rem;max-width:58ch}
.flowstep code{font-family:var(--display);font-size:0.86em;background:var(--signal-quiet);color:var(--signal);padding:1px 5px;border-radius:3px;font-weight:500}

.outcome{border-left:3px solid var(--signal);padding:4px 0 4px 22px;margin:8px 0 0}
.outcome .big{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:-0.03em;line-height:1.15;margin-bottom:10px}
.outcome p{margin:0;color:var(--moss);max-width:58ch}

.honest{background:var(--signal-quiet);padding:24px 26px;border-radius:4px}
.honest h4{margin-bottom:8px}
.honest p{margin:0;color:var(--ink);max-width:60ch}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .honest p{color:#D5DCE9}}
:root[data-theme="dark"] .honest p{color:#D5DCE9}

.scrub{font-size:0.86rem;color:var(--moss);font-style:italic;border-top:1px solid var(--rule);padding-top:14px;margin-top:8px}

.nextcs{border-top:1px solid var(--rule);margin-top:clamp(40px,6vw,70px);padding:30px 0 clamp(50px,7vw,80px)}
.nextcs a{text-decoration:none;display:block}
.nextcs .k{font-family:var(--display);font-size:0.8rem;color:var(--moss);margin-bottom:6px}
.nextcs h3{transition:color 160ms ease}
.nextcs a:hover h3{color:var(--signal)}

/* ---------- motion ---------- */
.rise{opacity:0;transform:translateY(10px)}
.rise.in{opacity:1;transform:none;transition:opacity 420ms ease,transform 420ms cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion: reduce){
  .rise,.rise.in{opacity:1;transform:none;transition:none}
  *{scroll-behavior:auto !important}
  .build,.clinks a,.nextcs h3{transition:none}
}
</style>
</head>
<body>

<div class="bar">
  <div class="shell">
    <a class="mark" href="#/">Kyle Myers <span>/ Miamisburg, Ohio</span></a>
    <nav class="barlinks">
      <a href="#/#work">Work</a>
      <a href="#/#results">Results</a>
      <a href="#/#about">About</a>
    </nav>
  </div>
</div>

<main id="app"></main>

<footer>
  <div class="shell">
    <span>Kyle Myers</span>
    <span>Client names withheld. Figures are real.</span>
  </div>
</footer>

<script>
/* ============================ CONTENT ============================ */

const BUILDS = [
  {
    slug:"ledgermetrics",
    name:"LedgerMetrics",
    kind:"Google Workspace add-on",
    blurb:"The agency paid $40,000 a year for a reporting connector that could not read the one data source the strategy actually ran on. I wrote the replacement.",
    meta:{ "Stack":"Apps Script, REST", "Built":"3 months, 2026", "Status":"Company-wide" },
    sub:"Replacing a $40,000 a year reporting vendor with an add-on that reads the platform the vendor could not.",
    spec:{ "Type":"Google Workspace add-on", "Stack":"Apps Script, JavaScript, REST API, GitHub", "Shipped":"July 2026, full rollout August 1", "Distribution":"Private Google Workspace Marketplace" },
    problem:[
      "Every client report at the agency was assembled from two places that disagreed with each other. Ad platform numbers came out of a paid connector at $40,000 a year. The numbers the strategy team actually made decisions on came out of the agency's own attribution platform, which the connector had no integration for.",
      "So the reporting workflow was: pull what the connector could reach, then open a second system, then reconcile by hand. Every account. Every month. The two sets of numbers were built on different attribution, so the reconciling was judgment work, not clerical work, and it fell on the people whose time was worth the most.",
      "Nobody was going to fix this. The connector vendor had no reason to build an integration for a platform with one customer, and the agency had no engineering team to build one for itself."
    ],
    built:[
      "A Google Workspace add-on that pulls attribution data directly into the sheet where the report already lives. A strategist opens a client's reporting workbook, picks a date range and a set of accounts from a sidebar, and the data arrives in the sheet with the same attribution model the strategy is built on.",
      "The part that made it usable rather than clever was auto-discovery. The add-on reads which accounts and campaigns exist rather than making anyone configure them, so a new client is set up by opening a sheet instead of by editing a config."
    ],
    flow:[
      ["Sidebar UI","A Google Sheets add-on sidebar built with Apps Script HTML service. Date range, account selection, and metric set. State persists per workbook."],
      ["Auto-discovery","On open, the add-on queries the attribution API for the accounts and campaigns available to that user and populates the selectors, so nothing is hardcoded per client."],
      ["Authenticated pull","Requests go to the attribution platform's REST API with credentials held in <code>PropertiesService</code>, never in the sheet or the source."],
      ["Shaping and write","Responses are normalized into a flat table and written to named ranges in one batched <code>setValues</code> call rather than cell by cell, which is the difference between a two second pull and a two minute one."],
      ["Scheduled refresh","Time-driven triggers re-run saved pulls on a schedule, so a workbook is current before anyone opens it."],
      ["Recurring pulls","A scheduler layer lets a user save a pull definition and have it repeat, which is what turned the tool from a fetcher into infrastructure."],
      ["Anchored targets","Each recurring pull is pinned to its block of data with hidden Developer Metadata on the block's row and column. When someone inserts or deletes rows or columns in a client sheet, the pull follows its data instead of writing to a cell the data has left. If an anchor is ever lost, a date guard stops the run before anything is written."],
      ["Configuration, not code","Client and team settings live in Script Properties alongside the credentials, so standing the add-on up for another team is a configuration change rather than a code change."]
    ],
    outcome:{
      big:"A $40,000 a year contract retired, and company-wide adoption inside two weeks.",
      body:"Soft launched in July 2026 and fully integrated across the agency on August 1. It is now the default way reports get built, and it does the thing the paid vendor never did, which is read the attribution platform the agency's own strategy depends on."
    },
    honest:{
      h:"What I would do differently",
      p:"I built this for three months in the Apps Script editor with no version control and no tests, and it went company-wide in that state. That caught up with me on October 20, when a column change in a client's reporting sheet left a recurring pull pointed one column off its data. It read revenue figures as dates and backfilled 20,746 rows of junk going back to 1970. So I went back and did what should have come first: a date guard that stops a run when the data under it does not look like dates, a run lock so two scheduled pulls cannot overlap, and redaction that keeps sensitive values out of the logs. Then I moved the code into a private GitHub repository with a test suite and fixed the root cause, so every recurring pull is now anchored to its data and follows it when rows or columns move. Every change now goes through a pull request and the tests before it ships. None of that was hard. It was just easy to skip while nothing had broken, and retrofitting it onto a tool people use every day is slower than starting with it. Production deploys stay a manual step on purpose, and that part I would keep."
    }
  },

  {
    slug:"highlighted",
    name:"Highlighted",
    kind:"React application",
    blurb:"Google's AI shopping surfaces read product data differently than classic Shopping does. Client catalogs had the relevant fields empty, and no tool generated them at catalog scale.",
    meta:{ "Stack":"React, GMC spec", "Scale":"10,000+ SKUs", "Status":"Live on client catalogs" },
    sub:"Generating the product data attributes that decide whether a catalog shows up in AI shopping results.",
    spec:{ "Type":"React application", "Stack":"React, JavaScript, Merchant Center feed spec", "Scale":"Over 10,000 SKUs processed", "Status":"Deployed live, second build requested" },
    problem:[
      "Google's AI-driven shopping surfaces do not read a product feed the way classic Shopping did. They lean on supplemental attributes, <em>product_highlight</em> and <em>product_detail</em> among them, that describe a product in structured, machine-legible terms rather than leaving it to a title and a description.",
      "Across the catalogs I was responsible for, those fields were empty. Not wrong, empty. Which meant thousands of products were being interpreted from a title string while competitors handed the same surfaces a structured answer.",
      "Filling them by hand is not a real option at ten thousand products, and the feed platforms did not generate them. So the choice was to leave the fields blank and hope, or build something."
    ],
    built:[
      "A React application that takes existing feed data, derives supplemental attributes for each product, validates them against the Merchant Center specification, and outputs a supplemental feed ready to upload.",
      "The generation is the interesting half, but the validation is the half that made it safe to run on a live catalog. A malformed supplemental feed does not fail loudly, it quietly gets ignored or, worse, gets products disapproved, and finding out a week later across ten thousand items is not a recoverable position."
    ],
    flow:[
      ["Feed ingest","Reads the client's existing primary feed and normalizes fields across the variations different platforms export."],
      ["Attribute derivation","For each product, derives <code>product_highlight</code> and <code>product_detail</code> values from the attributes already present, so output stays grounded in the merchant's own data rather than invented."],
      ["Spec validation","Every generated value is checked against Merchant Center's published constraints for that attribute: character limits, count limits, and formatting, before it can leave the tool."],
      ["Supplemental output","Emits a supplemental feed keyed on item id, so it layers onto the primary feed without touching it and can be rolled back by removing one file."],
      ["Review pass","Output is reviewed before upload. The tool is a generator with a human gate, not an automatic publisher, which matters when the thing being edited is a live revenue channel."]
    ],
    outcome:{
      big:"One client channel's platform-reported revenue tripled week over week after deployment, with no other changes made.",
      body:"Over 10,000 SKUs processed. The client asked for a second, branded build for a different property, which is the only endorsement that actually means anything."
    },
    honest:{
      h:"What I would do differently",
      p:"I built generation first and validation second, which meant the first real run produced output I could not safely upload and had to be reworked. On anything touching a live catalog the constraint layer should exist before the thing that produces the content, because the constraints are the part you cannot negotiate with."
    }
  },

  {
    slug:"loose-ends",
    name:"Loose Ends",
    kind:"Multi-source agent system",
    blurb:"I do not have a prioritization problem. I have a capture problem. Every tool built for this loses because it asks you to type the thing in.",
    meta:{ "Stack":"Scheduled agents", "Sources":"Gmail, iMessage, Reminders", "Status":"Running since Sept 2026" },
    sub:"Three unattended agents that read what I already wrote and surface what I already promised.",
    spec:{ "Type":"Multi-source agent system", "Sources":"Gmail, iMessage, Apple Reminders", "Schedule":"Three unattended runs daily", "Manual entry":"None" },
    problem:[
      "The commitments that go missing are not the ones on a list. They are the ones made in a sentence at the end of an email, or in a text on a Saturday, or halfway through a call. By the time they would have gone on a list, they have already been forgotten.",
      "Every task tool I had tried failed the same way. Each one was a novelty that required me to go somewhere I did not already go and type in something I had already said. The tools were fine. The handoff was the defect.",
      "So the requirement was narrow and non-negotiable: zero manual entry. If the system needs me to tell it something, it has already failed."
    ],
    built:[
      "Three scheduled agents, running morning, late afternoon, and night, that read the places I already write: email, messages, and my own reminders. They extract commitments, score their confidence, drop anything already acknowledged, and surface what is left.",
      "Two design decisions did most of the work. First, delivery goes to a native Apple Reminders list plus a three-line text, because a full list read as a wall of text I would learn to ignore. Second, an item does not expire quietly. It keeps surfacing until I explicitly acknowledge it, because silent expiry is how the previous attempts failed without telling me."
    ],
    flow:[
      ["Source read","Each run reads Gmail, iMessage, and Apple Reminders across a rolling window. Read-only access, scoped deliberately."],
      ["Extraction","Language that signals a commitment gets pulled out with the surrounding context, so an item arrives with enough to be recognizable rather than as a bare fragment."],
      ["Confidence scoring","Each candidate gets a confidence score. Below threshold it is dropped rather than shown, because a nag system that cries wolf gets muted within a week."],
      ["Dedupe against acknowledged","Anything previously acknowledged is suppressed, so the same item does not resurface after it is handled."],
      ["Two-channel delivery","Survivors land in an Apple Reminders list, plus a three-line text ping at 9:00am, 4:30pm, and 10:00pm."],
      ["Explicit close","An item stays live until acknowledged. Nothing disappears on its own."]
    ],
    outcome:{
      big:"96 commitments captured in seven weeks, 86 closed, with no manual entry.",
      body:"It is the only system of this kind I have built that survived past the first week, and the reason is the constraint rather than the code: it never asks me to do the thing I was never going to do."
    },
    honest:{
      h:"What I would do differently",
      p:"The schedule assumed the machine would be awake, and it was not always. When the Mac slept through a run time, the run fired late, and a 9:00am nudge that shows up at lunch is a different product than the one I designed. The fix was a scheduled system wake ahead of each run. The scope freeze earned its keep: I held off changing anything until real data existed, and seven weeks of it is what surfaced the problem. Next time I would design for the host being absent from the first run, not just the user."
    }
  },

  {
    slug:"disapproval-monitor",
    name:"Disapproval Monitor",
    kind:"Agency-wide alerting",

function reveal(){
  const els = document.querySelectorAll('.rise');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('in')); return; }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
  },{rootMargin:'0px 0px -8% 0px'});
  els.forEach(e=>io.observe(e));
}

function route(){
  const raw = location.hash.replace(/^#\/?/,'');
  const [path, anchor] = raw.split('#');
  const b = BUILDS.find(x=>x.slug===path);
  app.innerHTML = b ? caseStudy(b) : home();
  document.title = b ? `${b.name} | Kyle Myers` : 'Kyle Myers';
  reveal();
  if(anchor){
    const t = document.getElementById(anchor);
    if(t){ t.scrollIntoView({behavior:'auto',block:'start'}); return; }
  }
  window.scrollTo(0,0);
}

window.addEventListener('hashchange',route);
